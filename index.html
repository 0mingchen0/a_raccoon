<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Have Fun</title>
<style>
  * { box-sizing: border-box; font-family: 'JetBrains Mono', 'Segoe UI', monospace; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #0a0f1f 0%, #020617 60%);
    color: #e5e7eb;
  }

  /* 🌌 STAR BACKGROUND */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 1px; height: 1px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: blink 3s infinite alternate, drift linear infinite;
  }

  @keyframes blink {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
  }

  @keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(50px, -30px); }
  }

  /* 🌟 CARD */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(20, 30, 55, 0.85);
    border: 1px solid rgba(100, 150, 255, 0.15);
    box-shadow: 0 0 30px rgba(0, 140, 255, 0.15),
                inset 0 0 20px rgba(0, 140, 255, 0.05);
    padding: 32px;
    border-radius: 16px;
    width: 420px;
  }
  

  h2 { text-align: center; margin-bottom: 28px; color: #c7d2fe; letter-spacing: 1px; font-weight: 600; }

  .field { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  input {
    flex: 1; padding: 12px; border-radius: 8px;
    border: 1px solid rgba(96,165,250,0.25);
    background: rgba(0,0,0,0.6); color: #e0f2fe;
    outline: none; font-size: 14px;
  }
  input::placeholder { color: #64748b; }
  input:focus { border-color: #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,0.4); }

  .indicator { width: 14px; height: 14px; border-radius: 50%; background: #334155; transition: 0.3s ease; }
  .valid { background: #22d3ee; box-shadow: 0 0 10px #22d3ee; }
  .invalid { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

  .hint-btn {
    padding: 6px 10px; font-size: 11px; border-radius: 6px;
    border: 1px solid rgba(96,165,250,0.3);
    background: rgba(15, 23, 42, 0.8); color: #93c5fd;
    cursor: pointer; transition: 0.2s ease;
  }
  .hint-btn:hover { background: rgba(96,165,250,0.2); box-shadow: 0 0 10px rgba(96,165,250,0.5); transform: translateY(-1px); }

  .preview {
    margin-top: 26px; padding: 14px; background: rgba(0, 0, 0, 0.65);
    border-radius: 8px; text-align: center; font-size: 14px; letter-spacing: 1px;
    color: #c7d2fe; border: 1px solid rgba(96,165,250,0.25); transition: 0.3s ease;
  }
  .preview span { color: #7dd3fc; font-weight: 600; }
  @keyframes glow {
    0% { box-shadow: 0 0 8px rgba(96,165,250,0.3); transform: translateY(0); }
    50% { box-shadow: 0 0 25px rgba(96,165,250,0.9); transform: translateY(-3px); }
    100% { box-shadow: 0 0 8px rgba(96,165,250,0.3); transform: translateY(0); }
  }
  .preview.active { animation: glow 1.5s ease-in-out infinite; border-color: #60a5fa; }
</style>
</head>
<body>

<div class="stars"></div>

<div class="card">
  <h2>good luck :)</h2>
  <p>computer browser recommended, enjoy your gift! </p>

  <div class="field">
    <input id="input1" placeholder="hint: first gift" />
    <button class="hint-btn" onclick="goHint(1)">Hint</button>
    <div class="indicator" id="i1"></div>
  </div>

  <div class="field">
    <input id="input2" placeholder="hint: our most common phrase" />
    <button class="hint-btn" onclick="goHint(2)">Hint</button>
    <div class="indicator" id="i2"></div>
  </div>

  <div class="field">
    <input id="input3" placeholder="hint: you" />
    <button class="hint-btn" onclick="goHint(3)">Hint</button>
    <div class="indicator" id="i3"></div>
  </div>

  <div class="preview" id="previewBox">
    <span id="previewText">_____ ____ ___</span>.netlify.app
  </div>
</div>

<script>
  // 🌟 Star generation
  const starsContainer = document.querySelector('.stars');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = star.style.height = Math.random() * 2 + 1 + 'px';
    star.style.animationDuration = 2 + Math.random() * 3 + 's';
    star.style.animationDelay = Math.random() * 4 + 's';
    starsContainer.appendChild(star);
  }

  // ✅ Inputs logic
  const i1 = document.getElementById("input1");
  const i2 = document.getElementById("input2");
  const i3 = document.getElementById("input3");
  const p = document.getElementById("previewText");
  const previewBox = document.getElementById("previewBox");
  const i1dot = document.getElementById("i1");
  const i2dot = document.getElementById("i2");
  const i3dot = document.getElementById("i3");

  function sanitize(value) { return value.toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function update() {
  const v1 = i1.value.toLowerCase().trim();
  const v2 = i2.value.toLowerCase().trim();
  const v3 = i3.value.toLowerCase().trim();

  p.textContent = `${v1 || "_____"}-${v2 || "____"}-${v3 || "__"}`;

  // ✅ Set exact phrases here
  const exact1 = "ready";       // replace with your exact phrase
  const exact2 = "mwah";      // replace with your exact phrase
  const exact3 = "go";        // replace with your exact phrase

  // Only glow if exact match
  i1dot.className = "indicator " + (v1 === exact1 ? "valid" : "invalid");
  i2dot.className = "indicator " + (v2 === exact2 ? "valid" : "invalid");
  i3dot.className = "indicator " + (v3 === exact3 ? "valid" : "invalid");

  // Activate preview only if all are exact matches
  if (v1 === exact1 && v2 === exact2 && v3 === exact3) {
    previewBox.classList.add("active");
  } else {
    previewBox.classList.remove("active");
  }
}

  function goHint(n) {
    const pages = {1:"https://mywordle.strivemath.com/?word=nsugj",2:"https://redactle.net/en/g/loud-abrasive-gas",3:"gou.png"};
    window.location.href = pages[n];
  }
  i1.addEventListener("input", update);
  i2.addEventListener("input", update);
  i3.addEventListener("input", update);
</script>

</body>
</html>
